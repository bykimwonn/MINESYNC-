          options.headers['X-Company-Name'] = companyName;
        }
        
        if (options.body && !options.headers['Content-Type'] && !(options.body instanceof FormData)) {
          options.headers['Content-Type'] = 'application/json';

        const sum = completedWOs.reduce((acc, curr) => acc + (parseInt(curr.durationExpected) || 1), 0);

        return `${avg.toFixed(1)} hrs`;

        const entries = Object.keys(counts).map(name => ({ name, count: counts[name] }));

            { name: "Jaw Crusher 1", count: 0 },

                                            <label class="block text-xs text-brand-steelText uppercase mb-1 font-sans font-bold">Adjust progress slider</label>
                                            <input 
                                              type="range" 
                                              min="10" 
                                              max="95" 
                                              value={artisanProgressVal || wo.progress}
                                              onChange={(e) => {
                                                setArtisanProgressVal(e.target.value);
                                                handleUpdateProgress(wo.id, e.target.value, artisanNotesInput);
                                              }}
                                              class="w-full accent-brand-orange animate-duration-300"
                                            />
                                          </div>
                                          <div>
                                            <label class="block text-xs text-brand-steelText uppercase mb-1 font-sans font-bold">Progress logs</label>
                                            <input 
                                              type="text" 
                                              placeholder="E.g. Disassembled gear casing"
                                              value={artisanNotesInput}
                                              onChange={(e) => setArtisanNotesInput(e.target.value)}
                                              onBlur={() => handleUpdateProgress(wo.id, artisanProgressVal || wo.progress, artisanNotesInput)}
                                              class="w-full bg-brand-darkBg border border-brand-steelBorder rounded p-1.5 text-xs text-white"
                                            />
                                          </div>
                                        </div>

                                        <div class="bg-slate-900/40 p-4 border border-brand-steelBorder rounded flex gap-3 items-end font-mono text-xs">
                                          <div class="flex-grow font-sans font-bold">
                                            <label class="block text-xs text-brand-steelText uppercase mb-1 font-bold">Final closure notes</label>
                                            <input 
                                              type="text" 
                                              placeholder="What was completed?"
                                              id={`finalNotes-${wo.id}`}
                                              class="w-full bg-brand-darkBg border border-brand-steelBorder rounded p-2 text-xs text-white font-mono"
                                            />
                                          </div>
                                          <button 
                                            onClick={() => {
                                              const notesVal = document.getElementById(`finalNotes-${wo.id}`).value;
                                              if (!notesVal) {
                                                alert("Mandatory: Input final clearance notes to log complete.");
                                                return;
                                              }
                                              handleCompleteJob(wo.id, notesVal);
                                            }}
                                            class="px-4 py-2 bg-emerald-700 hover:bg-emerald-600 text-white font-bold text-xs uppercase rounded transition-colors"
                                          >
                                            Complete Outage Repair
                                          </button>
                                        </div>
                                      </div>
                                    )}

                                    {wo.status === "Completed" && (
                                      <div class="text-xs text-emerald-400 font-sans mt-2 bg-emerald-950/20 p-2.5 border border-emerald-800 rounded leading-relaxed font-bold">
                                        ✔️ <strong>SLA RESOLVED:</strong> {wo.artisanNotes} <br />
                                        <span class="text-[10px] text-slate-500 mt-1 block font-mono">Closed At: {wo.completedAt}</span>
                                      </div>
                                    )}

                                  </div>
                                ))}
                              </div>
                            )}

                          </div>
                        </div>

                        {/* Chat with Foreman directly & complain shortage */}
                        <div class="space-y-6 font-mono text-xs">
                          
                          {/* Chat board */}
                          <div class="bg-brand-cardBg border border-brand-steelBorder p-6 rounded-xl animate-duration-300">
                            <h3 class="text-md font-bold uppercase text-brand-orange brand-font mb-4 flex items-center justify-between font-sans">
                              <span>💬 Direct Radio to Foreman</span>
                              <span class="text-[10px] bg-slate-900 border border-brand-steelBorder text-brand-steelText px-2 py-0.5 rounded font-mono font-bold">Live Link</span>
                            </h3>

                            <div class="space-y-3 max-h-48 overflow-y-auto p-3 bg-brand-darkBg rounded border border-brand-steelBorder mb-3">
                              {chats.length === 0 ? (
                                <p class="text-xs text-brand-steelText py-4 text-center font-mono">No messages exchanged.</p>
                              ) : (
                                chats.map(chat => (
                                  <div key={chat.id} class={`p-2.5 rounded text-xs ${
                                    chat.sender === "Foreman" ? 'bg-slate-955 text-slate-400 mr-8 border-l-2 border-brand-orange' : 'bg-slate-900 text-slate-300 text-right ml-8 border-r-2 border-brand-steelText'
                                  }`}>
                                    <div class="font-bold text-[10px] text-brand-orange">{chat.sender} &rarr; {chat.receiver}</div>
                                    <p class="mt-1">{chat.text}</p>
                                    <span class="text-[9px] text-slate-600 block mt-1">{chat.timestamp}</span>
                                  </div>
                                ))
                              )}
                            </div>

                            <form onSubmit={handleSendDirectChat} class="flex gap-2">
                              <input 
                                type="text" 
                                required
                                placeholder="Message to Shift Foreman..."
                                value={typedChatMsg}
                                onChange={(e) => setPartTypedChatMsg(e.target.value)}
                                class="flex-grow bg-brand-darkBg border border-brand-steelBorder rounded p-2 text-xs text-white"
                              />
                              <button type="submit" class="px-3 py-1.5 bg-brand-orange text-white text-xs font-bold uppercase rounded font-mono font-bold">
                                Dispatch
                              </button>
                            </form>
                          </div>

                          {/* Shortage complaint box */}
                          <div class="bg-brand-cardBg border border-brand-steelBorder p-6 rounded-xl">
                            <h3 class="text-md font-bold uppercase text-white brand-font border-b border-brand-steelBorder pb-3 font-sans font-bold">
                              📢 Material Stock Complaints
                            </h3>
                            <p class="text-xs text-brand-steelText mt-2 mb-4 leading-relaxed font-sans">
                              Log missing spares or low stock here. The system compiles these to Foreman and Management screens.
                            </p>

                            <form onSubmit={handleReportShortage} class="space-y-3">
                              <input 
                                type="text" 
                                required
                                placeholder="E.g. Welding rods, hydraulic gaskets..." 
                                value={partComplaintInput}
                                onChange={(e) => setPartComplaintInput(e.target.value)}
                                class="w-full bg-brand-darkBg border border-brand-steelBorder rounded p-2 text-xs text-white focus:outline-none font-mono"
                              />
                              <button type="submit" class="w-full py-2 bg-red-950 hover:bg-red-900 border border-red-800 text-red-200 text-xs font-bold rounded tracking-wide uppercase transition-colors">
                                Dispatch Stock Warning
                              </button>
                            </form>
                          </div>

                        </div>

                      </div>
                    )}

                  </div>
                )}

              </div>
            )}

          </main>

          {/* --- C. PRINTABLE CERTIFICATE MODAL --- */}
          {activePrintWO && (
            <div class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 overflow-y-auto no-print">
              <div class="max-w-2xl w-full bg-white text-black p-8 rounded shadow-2xl relative space-y-6">
                
                <button 
                  onClick={() => setActivePrintWO(null)}
                  class="absolute top-4 right-4 text-slate-500 hover:text-black font-extrabold text-sm font-sans"
                >
                  ✕ Close
                </button>

                <div id="print-sheet-content" class="print-card space-y-8 font-serif text-black leading-relaxed">
                  
                  {/* Header */}
                  <div class="border-b-2 border-black pb-4 flex justify-between items-start font-sans">
                    <div>
                      <h1 class="text-xl font-bold tracking-tight uppercase">{companyName}</h1>
                      <p class="text-xs tracking-wider font-mono font-sans">OUTAGE CLEARANCE COMPLIANCE CERTIFICATE</p>
                      <p class="text-[10px] text-slate-600 font-mono mt-0.5">SYSTEM GENERATED CERTIFICATE ID: {activePrintWO.id}</p>
                    </div>
                    
                    <div class="w-14 h-14 bg-white border border-black flex items-center justify-center p-0.5 animate-duration-300">
                      {!logoImageError ? (
                        <img 
                          src={companyLogoUrl} 
                          alt="Logo Stamp" 
                          class="max-h-full max-w-full object-contain" 
                          onError={handleLogoLoadError} 
                        />
                      ) : (
                        <div class="font-sans font-bold text-xs">MINESYNC</div>
                      )}
                    </div>
                  </div>

                  {/* Section 1: Specifications */}
                  <div class="space-y-3 font-sans text-xs">
                    <h3 class="text-sm font-bold uppercase border-b border-black pb-1">1. OUTAGE WORK ORDER OVERVIEW:</h3>
                    <table class="w-full text-xs text-left border-collapse">
                      <tbody>
                        <tr class="border-b border-slate-200">
                          <td class="py-1.5 font-bold w-1/3">Work Order Serial:</td>
                          <td class="py-1.5">{activePrintWO.id}</td>
                        </tr>
                        <tr class="border-b border-slate-200">
                          <td class="py-1.5 font-bold">Equipment Asset:</td>
                          <td class="py-1.5">{activePrintWO.assetName}</td>
                        </tr>
                        <tr class="border-b border-slate-200">
                          <td class="py-1.5 font-bold">Asset Serial Number:</td>
                          <td class="py-1.5 underline">{activePrintWO.serial}</td>
                        </tr>
                        <tr class="border-b border-slate-200">
                          <td class="py-1.5 font-bold">Priority Status:</td>
                          <td class="py-1.5">{activePrintWO.priority}</td>
                        </tr>
                        <tr class="border-b border-slate-200">
                          <td class="py-1.5 font-bold">Expected Shift Duration:</td>
                          <td class="py-1.5 font-sans">{activePrintWO.durationExpected} days</td>
                        </tr>
                        <tr class="border-b border-slate-200">
                          <td class="py-1.5 font-bold font-sans">Approved Budget Cost:</td>
                          <td class="py-1.5 font-sans">${activePrintWO.repairCost || "Standard clearance"}</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>

                  {/* Section 2: Written description guidelines */}
                  <div class="space-y-2 font-serif text-xs">
                    <h3 class="text-sm font-bold uppercase border-b border-black pb-1 font-sans">2. SPECIFIC REPAIR INSTRUCTIONS:</h3>
                    <p class="text-xs italic bg-slate-100 p-2 rounded font-sans">
                      &ldquo; {activePrintWO.title} &rdquo;
                    </p>
                    <p class="text-xs leading-relaxed text-slate-700 font-sans">
                      <strong>Method Statement:</strong> {activePrintWO.description}
                    </p>
                    {activePrintWO.engineeringDirective && (
                      <p class="text-xs text-red-800 bg-red-50 p-2 border-l-2 border-red-800 font-sans">
                        <strong>Engineering Directive Override:</strong> {activePrintWO.engineeringDirective}
                      </p>
                    )}
                  </div>

                  {/* Section 3: Artisan logs */}
                  <div class="space-y-2 font-serif">
                    <h3 class="text-sm font-bold uppercase border-b border-black pb-1 font-sans">3. EXECUTING ROSTER LOGS:</h3>
                    <p class="text-xs font-sans">
                      <strong>Executing Artisan:</strong> {activePrintWO.assignedToName} (Roster Trade: {activePrintWO.assignedToName.includes("Bongani") ? "Boiler Maker" : "Fitter"})
                    </p>
                    <p class="text-xs font-sans">
                      <strong>Completion Timestamp:</strong> {activePrintWO.completedAt || "PENDING WORK CLEARANCE"}
                    </p>
                    <p class="text-xs leading-relaxed font-sans">
                      <strong>Artisan Verification Statement:</strong> {activePrintWO.artisanNotes || "Await mechanical completion notes."}
                    </p>
                  </div>

                  {/* SIGN-OFF DOTTED LINES FOR LEGITIMACY SIGNATURES */}
                  <div class="pt-8 border-t-2 border-black grid grid-cols-3 gap-6 text-[10px] font-sans">
                    
                    <div class="space-y-6">
                      <p class="border-b border-black text-center italic text-[11px] h-8 flex items-end justify-center text-slate-700">
                        {activePrintWO.authorizedBy || "___________________"}
                      </p>
                      <p class="text-center uppercase font-bold text-[9px] text-slate-800 font-sans">Section Engineer<br />(Authorization & Date)</p>
                    </div>

                    <div class="space-y-6">
                      <p class="border-b border-black text-center italic text-[11px] h-8 flex items-end justify-center text-slate-700">
                        Verified by Foreman Tau
                      </p>
                      <p class="text-center uppercase font-bold text-[9px] text-slate-800 font-sans font-bold">Shift Foreman<br />(Verification & Date)</p>
                    </div>

                    <div class="space-y-6">
                      <p class="border-b border-black text-center italic text-[11px] h-8 flex items-end justify-center text-slate-700">
                        {activePrintWO.completedAt ? activePrintWO.assignedToName : "___________________"}
                      </p>
                      <p class="text-center uppercase font-bold text-[9px] text-slate-800">Artisan Technician<br />(Execution & Date)</p>
                    </div>

                  </div>

                  {/* Official print disclaimers */}
                  <div class="text-[9px] text-slate-500 text-center pt-4 border-t border-slate-200 font-sans">
                    This document is a legitimate written metallurgical compliance certificate generated by MINESYNC. <br />
                    Please safeguard physical copies as per Plant Logistics and Operations guidelines. Support: {companySupportEmail} | Contacts: {companyContacts}
                  </div>

                </div>

                {/* Print and PDF Triggers */}
                <div class="flex gap-4 pt-4 border-t border-slate-200 font-mono text-xs no-print font-sans">
                  <button 
                    onClick={() => window.print()}
                    class="flex-1 py-3 bg-brand-orange hover:bg-brand-orangeHover text-white font-bold uppercase rounded shadow-md font-bold"
                  >
                    🖨️ Trigger System Print
                  </button>
                  <button 
                    onClick={() => {
                      window.print();
                    }}
                    class="flex-1 py-3 bg-black hover:bg-slate-900 text-white font-bold uppercase rounded shadow-md font-bold"
                  >
                    💾 Save as Legit PDF Copy
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* --- D. OPERATIONS ENGINEER ADMIN PASS RESET BYPASS MODAL --- */}
          {showOpsBypassModal && (
            <div class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 overflow-y-auto no-print">
              <div class="max-w-md w-full bg-brand-cardBg border-2 border-brand-orange rounded-xl p-8 shadow-2xl relative text-left space-y-4 font-mono text-xs animate-duration-300">
                
                <button 
                  onClick={() => setShowOpsBypassModal(false)}
                  class="absolute top-4 right-4 text-slate-500 hover:text-white font-extrabold text-sm"
                >
                  ✕
                </button>

                <div class="text-center pb-2 border-b border-brand-steelBorder font-sans">
                  <span class="text-3xl">📐</span>
                  <h3 class="text-md font-bold uppercase text-brand-orange brand-font mt-1 font-mono text-xs font-bold font-mono">Ops Engineer Bypass</h3>
                  <p class="text-[10px] text-brand-steelText mt-0.5 font-mono">ADMIN RECOVERY & CREDENTIALS RESET</p>
                </div>

                <form onSubmit={handleOpsAdminBypass} class="space-y-4">
                  <div class="bg-brand-orange/10 border border-brand-orange/30 p-2.5 rounded text-[11px] text-brand-orange leading-relaxed font-sans font-bold">
                    ⚙️ <strong>Engineer Authority:</strong> Input your registered Operations Engineer username and password. If matched, you will be authorized to define new credentials for the primary Admin account.
                  </div>
                  
                  <div class="space-y-2">
                    <label class="block text-[10px] text-brand-steelText uppercase font-bold">Ops Engineer Position ID</label>
                    <input 
                      type="text"
                      required
                      placeholder="e.g. Operations Engineer"
                      value={opsUsernameInput}
                      onChange={(e) => setOpsUsernameInput(e.target.value)}
                      class="w-full bg-brand-darkBg border border-brand-steelBorder rounded p-2 text-white"
                    />
                  </div>

                  <div class="space-y-2">
                    <label class="block text-[10px] text-brand-steelText uppercase font-bold font-mono">Ops Engineer Password</label>
                    <input 
                      type="password"
                      required
                      placeholder="Enter Ops password"
                      value={opsPasswordInput}
                      onChange={(e) => setOpsPasswordInput(e.target.value)}
                      class="w-full bg-brand-darkBg border border-brand-steelBorder rounded p-2 text-white focus:outline-none focus:border-brand-orange font-mono"
                    />
                  </div>

                  <div class="border-t border-brand-steelBorder/40 pt-3 space-y-2 animate-duration-300">
                    <h4 class="text-[10px] font-bold text-white uppercase mb-1 font-sans font-bold">Define New Admin Credentials:</h4>
                    
                    <div class="grid grid-cols-2 gap-2 font-mono text-xs">
                      <div>
                        <label class="block text-[9px] text-brand-steelText uppercase">New Admin Username</label>
                        <input 
                          type="text"
                          required
                          placeholder="sys_admin"
                          value={newBypassAdminUser}
                          onChange={(e) => setNewBypassAdminUser(e.target.value)}
                          class="w-full bg-brand-darkBg border border-brand-steelBorder rounded p-1.5 text-white font-mono"
                        />
                      </div>
                      <div>
                        <label class="block text-[9px] text-brand-steelText uppercase font-bold">New Admin Password</label>
                        <input 
                          type="password"
                          required
                          placeholder="New password"
                          value={newBypassAdminPass}
                          onChange={(e) => setNewBypassAdminPass(e.target.value)}
                          class="w-full bg-brand-darkBg border border-brand-steelBorder rounded p-1.5 text-white font-bold"
                        />
                      </div>
                    </div>
                  </div>

                  <div class="flex gap-3 font-sans text-xs">
                    <button type="submit" class="flex-grow py-2.5 bg-brand-orange hover:bg-brand-orangeHover text-white font-bold uppercase rounded font-mono font-bold font-sans">
                      Authorize Bypass & Reset
                    </button>
                    <button 
                      type="button" 
                      onClick={() => setShowOpsBypassModal(false)}
                      class="px-4 py-2 bg-slate-900 border border-brand-steelBorder text-slate-300 rounded font-sans font-bold"
                    >
                      Cancel
                    </button>
                  </div>
                </form>

              </div>
            </div>
          )}

          {/* FOOTER */}
          {currentUser && (
            <footer class="no-print border-t border-brand-steelBorder bg-slate-950 px-6 py-3 flex flex-col md:flex-row justify-between items-center text-xs text-brand-steelText font-mono gap-2 animate-duration-300">
              <span>MINESYNC PLATFORM OPERATIONS // {companyName.toUpperCase()} LOGISTICS</span>
              <div class="flex gap-4">
                <span>Core DB Records: {assets.length + inventory.length + users.length + workOrders.length + chats.length}</span>
                <span class="text-brand-orange font-bold font-mono">SLA SECURE</span>
              </div>
            </footer>
          )}

        </div>
      );
    }

    // Work Orders table helper component
    function WorkOrdersTable({ wos, onRowSelect, activeSelectedId }) {
      if (wos.length === 0) {
        return (
          <div class="p-8 text-center bg-brand-darkBg border border-dashed border-brand-steelBorder rounded-lg">
            <span class="text-3xl font-sans">🧹</span>
            <p class="text-sm text-brand-steelText font-mono mt-2">No breakdowns reported. Plant is healthy.</p>
          </div>
        );
      }

      return (
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse font-sans text-xs">
            <thead>
              <tr class="border-b border-brand-steelBorder text-brand-steelText text-[11px] uppercase font-mono">
                <th class="py-2.5">Code</th>
                <th class="py-2.5">Job Title</th>
                <th class="py-2.5">Asset</th>
                <th class="py-2.5">Assigned To</th>
                <th class="py-2.5">Expected Days</th>
                <th class="py-2.5">Status</th>
                <th class="py-2.5">Progress</th>
              </tr>
            </thead>
            <tbody class="text-xs font-mono text-slate-300 divide-y divide-brand-steelBorder">
              {wos.map((wo, index) => (
                <tr 
                  key={index} 
                  onClick={() => onRowSelect && onRowSelect(wo.id)}
                  class={`hover:bg-brand-orange/10 cursor-pointer transition-colors ${
                    wo.status === "Awaiting Spares" ? "bg-red-950/20 text-red-200" : ""
                  } ${activeSelectedId === wo.id ? "bg-brand-orange/20 border-l-4 border-brand-orange" : ""}`}
                >
                  <td class="py-3 text-brand-orange font-bold pl-2">{wo.id}</td>
                  <td class="py-3">
                    <span class="font-bold text-white block">{wo.title}</span>
                    <span class="text-[10px] text-slate-400 block font-mono font-normal">{wo.description.slice(0, 50)}...</span>
                  </td>
                  <td class="py-3 font-sans">{wo.assetName}</td>
                  <td class="py-3 text-brand-steelText font-sans">{wo.assignedToName}</td>
                  <td class="py-3 text-center font-sans font-bold">{wo.durationExpected}d</td>
                  <td class="py-3">
                    <span class={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                      wo.status === "Pending" ? "bg-amber-500/10 text-amber-400 border border-amber-500/20" :
                      wo.status === "In-Progress" ? "bg-blue-500/10 text-blue-400 border border-blue-500/20" :
                      wo.status === "Awaiting Spares" ? "bg-red-500/10 text-red-500 border border-red-500/20 font-bold" :
                      "bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"
                    }`}>
                      {wo.status}
                    </span>
                  </td>
                  <td class="py-3 pr-2 font-sans">
                    <div class="flex items-center gap-2">
                      <div class="w-16 bg-slate-900 h-2 rounded overflow-hidden">
                        <div class="bg-brand-orange h-full" style={{ width: `${wo.progress}%` }}></div>
                      </div>
                      <span>{wo.progress}%</span>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // Render React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
