      const [newUsrUser, setNewUsrUser] = useState("");
      const [newUsrRole, setNewUsrRole] = useState("Artisan");
      const [newUsrTrade, setNewUsrTrade] = useState("Boiler Maker"); 
      const [newUsrEmail, setNewUsrEmail] = useState("");
      const [newUsrWhatsapp, setNewUsrWhatsapp] = useState("");

      const handleCreateUserByAdmin = (e) => {
        e.preventDefault();
        if (!newUsrName || !newUsrUser || !newUsrEmail || !newUsrWhatsapp) {
          alert("All parameters must be set.");
          return;
        }
        if (users.some(u => u.username === newUsrUser)) {
          alert("Username is already taken.");
          return;
        }
        const newUser = {
          id: `U-${Date.now()}`,
          username: newUsrUser,
          name: newUsrName,
          role: newUsrRole,
          trade: newUsrTrade,
          password: "temp123", // Default password
          changedPassword: false,
          email: newUsrEmail,
          whatsapp: newUsrWhatsapp,
          online: false,
          completedCount: 0,
          assignedCount: 0,
          slaAdherence: 100,
          dob: "",
          address: "",
          emergencyName: "",
          emergencyPhone: "",
          profileImg: ""
        };
        setUsers([...users, newUser]);
        setNewUsrName("");
        setNewUsrUser("");
        setNewUsrEmail("");
        setNewUsrWhatsapp("");
        triggerNotification("Employee Created", `User ${newUsrName} created. Default password is 'temp123'.`, "Admin");

      // --- PLANT WORKFORCE SIGN-INS ---
      const [plantUsername, setPlantUsername] = useState("");
      const [plantPassword, setPlantPassword] = useState("");

      const handlePlantLogin = (e) => {
        if (e) e.preventDefault();

        if (selectedLoginCompany.trim() !== companyName) {
          setErrorMsg(`Validation Failed: Unrecognized Organization Name "${selectedLoginCompany}".`);
          return;
        }

        if (isAccountLocked(plantUsername)) {
          setErrorMsg("🚫 ACCOUNT BLOCKED: Reset credentials via standard email recovery or ask your Admin.");
          return;
        }

        if (plantSubRole === "Management") {
          const foundMgmt = management.find(m => m.position === plantUsername && m.password === plantPassword);
          if (foundMgmt) {
            clearFailedAttempts(plantUsername);
            setCurrentUser({ name: foundMgmt.name, username: foundMgmt.position, role: foundMgmt.position });
            setCurrentRole("PLANT_MANAGEMENT");
            triggerNotification("Management Core Engaged", `Welcome, ${foundMgmt.name} (${foundMgmt.position}).`, "System");
            setErrorMsg("");
          } else {
            recordFailedAttempt(plantUsername);
            setErrorMsg("Incorrect credentials or position select.");
          }
        } else {
          const foundUser = users.find(u => u.username === plantUsername && u.password === plantPassword);
          if (foundUser) {
            clearFailedAttempts(plantUsername);
            setUsers(prev => prev.map(u => u.id === foundUser.id ? { ...u, online: true } : u));
            setCurrentUser(foundUser);

            if (foundUser.role === "Foreman") {
              setCurrentRole("PLANT_FOREMAN");
              triggerNotification("Foreman Console Initialized", `Roster dispatcher loaded for ${foundUser.name}.`, "System");
            } else {
              setCurrentRole("PLANT_ARTISAN");
              triggerNotification("Artisan Portal Connected", `Technician log ready for ${foundUser.name}.`, "System");
            }
            setErrorMsg("");
          } else {
            recordFailedAttempt(plantUsername);
            setErrorMsg("Invalid username or password.");
          }
        }
      };

      // Password recovery request (Standard email code send)
      const handleTriggerForgotPassword = (e) => {
        e.preventDefault();
        if (!forgotPasswordEmail.trim()) return;

        fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: forgotPasswordEmail.trim() })
        })
        .then(res => {
          if (!res.ok) throw new Error("Email not found");
          return res.json();
        })
        .then(data => {
          setRecoveryGeneratedCode(data.recoveryCode.toString());
          setRecoveredAccountEmail(forgotPasswordEmail.trim());
          setRecoveryState("SENT");
          setForgotPasswordEmail("");
          triggerNotification("Security Code Dispatched", `Sent safely to ${forgotPasswordEmail.trim()}. Check your email app!`, "System");
        })
        .catch(e => {
          alert("Error: That email address is not registered in our MINESYNC Roster.");
        });
      };

      const handleConfirmRecoveryCode = (e) => {
        e.preventDefault();
        if (recoveryCodeInput.trim() === generatedCode) {
          setRecoveryState("CONFIRMED");
          setErrorMsg("");
        } else {
          setErrorMsg("Invalid recovery code. Please check your email inbox carefully.");
        }
      };

      const handleCommitRecoveryPassword = (e) => {
        e.preventDefault();
        if (newForgotPassword.length < 5) {
          alert("Password must be at least 5 characters long.");
          return;
        }

        fetch('/api/auth/reset-password-confirm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: recoveredAccountEmail, newPassword: newForgotPassword })
        })
        .then(res => res.json())
        .then(() => {
          setUsers(prev => prev.map(u => {
            if (u.email.toLowerCase() === recoveredAccountEmail.toLowerCase()) {
              return { ...u, password: newForgotPassword, changedPassword: true };
            }
            return u;
          }));

          setAdmins(prev => prev.map(a => {
            if (a.email.toLowerCase() === recoveredAccountEmail.toLowerCase()) {
              return { ...a, password: newForgotPassword };
            }
            return a;
          }));

          setRecoveryState("NONE");
          setRecoveryCodeInput("");
          setNewForgotPassword("");
          setRecoveredAccountEmail("");
          alert("🔒 Password changed successfully! You can now log into your specialized section.");
        });
      };

      // --- BYPASS RESET ADMIN PASSWORD VIA OPERATIONS ENGINEER ---
      const handleOpsAdminBypass = (e) => {
        e.preventDefault();
        if (!opsUsernameInput || !opsPasswordInput || !newBypassAdminUser || !newBypassAdminPass) {
          alert("All bypass fields are mandatory.");
          return;
        }

        fetch('/api/auth/ops-recovery-reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            opsUsername: opsUsernameInput.trim(),
            opsPassword: opsPasswordInput,
            newAdminUser: newBypassAdminUser.trim(),
            newAdminPass: newBypassAdminPass
          })
        })
        .then(res => {
          if (!res.ok) throw new Error("Authorization denied");
          return res.json();
        })
        .then(data => {
          setAdmins([{
            username: newBypassAdminUser.trim(),
            password: newBypassAdminPass,
            name: "Shift Admin",
            email: "admin@minesync.com"
          }]);
          
          setShowOpsBypassModal(false);
          setOpsUsernameInput("");
          setOpsPasswordInput("");
          setNewBypassAdminUser("");
          setNewBypassAdminPass("");
          
          alert("🟢 Operations Engineer Clearance Approved! The Administrator credentials have been successfully reset. You can now log into the Admin portal.");
        })
        .catch(err => {
          alert("Bypass Denied: Credentials do not match the registered 'Operations Engineer'. Please configure their profile first.");
        });
      };

      // Save SMTP Mail Settings in DB
      const handleSaveSMTPSettings = (e) => {
        e.preventDefault();
        fetch('/api/company', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            smtp: {
              host: smtpHost,
              port: smtpPort,
              user: smtpUser,
              pass: smtpPass,
              from: smtpFrom
            }
          })
        })
        .then(res => res.json())
        .then(() => {
          triggerNotification("SMTP Settings Updated", "Secure Mail Server values successfully committed to backend server.", "System");
          alert("✉️ SMTP Configuration Saved! If you inputted your actual Gmail details, MINESYNC will now send real recovery emails!");
        });
      };

      // --- FOREMAN ACTIONS ---
      const [jobName, setJobName] = useState("");
      const [jobSerial, setJobSerial] = useState("");
      const [jobWhatToDo, setJobWhatToDo] = useState("");
      const [jobAssetId, setJobAssetId] = useState("");
      const [jobDays, setJobDays] = useState("1");
      const [jobPeopleCount, setJobPeopleCount] = useState("1");
      const [jobArtisanId, setJobArtisanId] = useState("");
      const [jobPartRequired, setJobPartRequired] = useState("");

      const handleJobNameChange = (val) => {
        setJobName(val);
        if (val.trim().length > 1) {
          const filtered = suggestions.jobNames.filter(item => item.toLowerCase().includes(val.toLowerCase()));
          setActiveJobSuggestions(filtered);
        } else {
          setActiveJobSuggestions([]);
        }
      };

      const handleSerialChange = (val) => {
        setJobSerial(val);
        if (val.trim().length > 1) {
          const filtered = suggestions.serialNumbers.filter(item => item.toLowerCase().includes(val.toLowerCase()));
          setActiveSerialSuggestions(filtered);
        } else {
          setActiveSerialSuggestions([]);
        }
      };

      const handleInstructionChange = (val) => {
        setJobWhatToDo(val);
        if (val.trim().length > 1) {
          const filtered = suggestions.whatToDos.filter(item => item.toLowerCase().includes(val.toLowerCase()));
          setActiveInstructionSuggestions(filtered);
        } else {
          setActiveInstructionSuggestions([]);
        }
      };

      const handleSelectJobSuggestion = (text) => {
        setJobName(text);
        setActiveJobSuggestions([]);
        if (text.includes("Ball Mill")) {
          setJobSerial("BM-1024");
          setJobAssetId("AST-101");
          setJobWhatToDo(suggestions.whatToDos[1]);
        } else if (text.includes("Conveyor") || text.includes("Crusher")) {
          setJobSerial("JC-0899");
          setJobAssetId("AST-102");
          setJobWhatToDo(suggestions.whatToDos[3]);
        } else if (text.includes("Flotation") || text.includes("Level")) {
          setJobSerial("FC-0453");
          setJobAssetId("AST-103");
          setJobWhatToDo(suggestions.whatToDos[2]);
        } else if (text.includes("MCC") || text.includes("contactor")) {
          setJobSerial("TK-0221");
          setJobAssetId("AST-104");
          setJobWhatToDo(suggestions.whatToDos[4]);
        }
      };

      const handleCreateWorkOrder = (e) => {
        e.preventDefault();
        if (!jobName || !jobAssetId || !jobArtisanId) {
          alert("All mandatory fields must be specified.");
          return;
        }

        const selectedAsset = assets.find(a => a.id === jobAssetId);
        const selectedArtisan = users.find(u => u.id === jobArtisanId);
        const targetPart = inventory.find(p => p.name === jobPartRequired);

        let status = "Pending";
        let isShortage = false;

        if (jobPartRequired && targetPart) {
          if (targetPart.quantity <= 0) {
            status = "Awaiting Spares";
            isShortage = true;
          }
        }

        const newWO = {
          id: `WO-${Math.floor(1000 + Math.random() * 9000)}`,
          title: jobName,
          serial: jobSerial || (selectedAsset ? selectedAsset.serial : ""),
          description: jobWhatToDo || "Perform standard structural visual check.",
          assetId: jobAssetId,
          assetName: selectedAsset ? selectedAsset.name : "Asset",
          criticality: selectedAsset ? selectedAsset.criticality : "Low",
          priority: (selectedAsset && selectedAsset.criticality === "High") ? "Urgent" : "Medium",
          status: status,
          assignedToId: selectedArtisan ? selectedArtisan.id : "",
          assignedToName: selectedArtisan ? selectedArtisan.name : "Artisan",
          durationExpected: jobDays,
          peopleCount: jobPeopleCount,
          partsRequired: jobPartRequired || "None",
          partsShortageFlag: isShortage,
          createdAt: new Date().toLocaleString(),
          completedAt: null,
          progress: 0,
          progressNotes: "",
          artisanNotes: "",
          authorizedBy: "", 
          engineeringDirective: ""
        };

        const updatedWOs = [newWO, ...workOrders];
        setWorkOrders(updatedWOs);

        if (selectedArtisan) {
          setUsers(prev => prev.map(u => {
            if (u.id === selectedArtisan.id) {
              return { ...u, assignedCount: (u.assignedCount || 0) + 1 };
            }
            return u;
          }));
        }

        // Learn input history
        const updatedSuggestions = { ...suggestions };
        if (!updatedSuggestions.jobNames.includes(jobName)) updatedSuggestions.jobNames.push(jobName);
        if (jobSerial && !updatedSuggestions.serialNumbers.includes(jobSerial)) updatedSuggestions.serialNumbers.push(jobSerial);
        if (jobWhatToDo && !updatedSuggestions.whatToDos.includes(jobWhatToDo)) updatedSuggestions.whatToDos.push(jobWhatToDo);
        setSuggestions(updatedSuggestions);

        if (selectedArtisan && selectedArtisan.whatsapp && selectedArtisan.email) {
          triggerNotification(
            `Dispatch Alert sent to ${selectedArtisan.name}`,
            `📲 WhatsApp text to ${selectedArtisan.whatsapp} & 📧 Email dispatch cleared.`,
            "WhatsApp"
          );
        }

        setJobName("");
        setJobSerial("");
        setJobWhatToDo("");
        setJobAssetId("");
        setJobDays("1");
        setJobPeopleCount("1");
        setJobArtisanId("");
        setJobPartRequired("");
      };

      // --- ADVANCED MANAGEMENT ACTIONS ---
      const [mgmtDirectiveInput, setMgmtDirectiveInput] = useState("");
      const [mgmtBudgetInput, setMgmtBudgetInput] = useState("");
      const [activeSelectedWOId, setActiveSelectedWOId] = useState("");
      
      const handleAddManagementDirective = (woId) => {
        if (!mgmtDirectiveInput.trim()) return;
        setWorkOrders(prev => prev.map(wo => {
          if (wo.id === woId) {
            return { 
              ...wo, 
              engineeringDirective: mgmtDirectiveInput,
              authorizedBy: currentUser.username
            };
          }
          return wo;
        }));
        setMgmtDirectiveInput("");
        triggerNotification("Directive Dispatched", `Safety / Engineering guidelines registered on Work Order ${woId}.`, "System");
      };

      const handleAddBudgetApprove = (woId) => {
        if (!mgmtBudgetInput.trim()) return;
        setWorkOrders(prev => prev.map(wo => {
          if (wo.id === woId) {
            return { 
              ...wo, 
              repairCost: mgmtBudgetInput,
              authorizedBy: currentUser.username
            };
          }
          return wo;
        }));
        setMgmtBudgetInput("");
        triggerNotification("Budget Clearance Issued", `Repair cost approved for Work Order ${woId}.`, "System");
      };

      // Direct restocking of inventory
      const [refillPartName, setRefillPartName] = useState("");
      const [refillQuantity, setRefillQuantity] = useState(10);
      const handleRestockParts = (partName, qty) => {
        setInventory(prev => prev.map(p => p.name === partName ? { ...p, quantity: p.quantity + parseInt(qty) } : p));
        triggerNotification("Stores Replenished", `${qty} units added to ${partName} stockpile.`, "System");
      };

      // --- MOCK INTEGRATED "AI" ADAPTIVE TEXT ENGINE ---
      const generateAIReportSummary = () => {
        const activeOrdersCount = workOrders.filter(w => w.status !== "Completed").length;
        const completeOrdersCount = workOrders.filter(w => w.status === "Completed").length;
        const awaitingSparesCount = workOrders.filter(w => w.status === "Awaiting Spares").length;
        
        let report = `AI PLANT OPERATIONAL REPORT - SYNTHESIS\n`;
        report += `===============================================\n\n`;
        report += `Live Metrics Analyzed:\n`;
        report += `- Outstanding Plant Breakdowns: ${activeOrdersCount} Active Outages\n`;
        report += `- Completed Shift Tickets: ${completeOrdersCount} Resolved Repairs\n`;
        report += `- Material-Blocked Repairs (Red Flags): ${awaitingSparesCount} Awaiting Spares\n`;
        report += `- Calculated MTTR Speed: ${getMTTR()}\n\n`;

        report += `Matching live metrics against written Management Directives...\n`;
        report += `\"${plantGuidelines}\"\n\n`;

        // Interactive matching algorithms
        let vulnerabilities = [];
        let performanceAdherence = [];

        if (plantGuidelines.toLowerCase().includes("ball mill 2")) {
          const millOutages = workOrders.filter(w => w.assetId === "AST-101" && w.status !== "Completed");
          if (millOutages.length > 0) {
            vulnerabilities.push(`CRITICAL DANGER: Your guidelines specify that 'If Ball Mill 2 is down, the entire flotation circuit is halted'. Currently, there are ${millOutages.length} active breakdowns on Ball Mill 2. Circuit is stalled.`);
          } else {
            vulnerabilities.push(`Milling Circuit Status: Ball Mill 2 is running fine. Flotation circuit risk is currently nominal.`);
          }
        }

        if (plantGuidelines.toLowerCase().includes("boiler maker") || plantGuidelines.toLowerCase().includes("hours")) {
          const boilerMakers = users.filter(u => u.trade === "Boiler Maker");
          boilerMakers.forEach(bm => {
            const adRate = bm.slaAdherence || 100;
            if (adRate < 90) {
              performanceAdherence.push(`SLA Alert: Boiler Maker ${bm.name} has an SLA speed of ${adRate}%, failing your guideline target of 'clearing structural frame cracks within 4 hours'.`);
            }
          });
        }

        if (plantGuidelines.toLowerCase().includes("spares") || plantGuidelines.toLowerCase().includes("units")) {
          const criticalParts = inventory.filter(p => p.quantity <= 2);
          criticalParts.forEach(p => {
            vulnerabilities.push(`Stock warning: '${p.name}' quantity is ${p.quantity} units, failing your plant guideline rule of 'spares must always be kept above 2 units'.`);
          });
        }

        report += `AI Diagnostic Findings:\n`;
        if (vulnerabilities.length === 0 && performanceAdherence.length === 0) {
          report += `🟢 Plant operations are fully optimized. No structural, mechanical, or stockpile rules violated. Standard MTTR is within guidelines.`;
        } else {
          vulnerabilities.forEach(v => { report += `🔴 ${v}\n`; });
          performanceAdherence.forEach(p => { report += `⚠️ ${p}\n`; });
        }

        return report;
      };

      // --- ARTISAN ACTIONS ---
      const [artisanNotesInput, setArtisanNotesInput] = useState("");
      const [artisanProgressVal, setArtisanProgressVal] = useState(0);
      const [partComplaintInput, setPartComplaintInput] = useState("");

      const handleApproveJob = (woId) => {
        setWorkOrders(prev => prev.map(wo => {
          if (wo.id === woId) {
            const nextStatus = wo.partsShortageFlag ? "Awaiting Spares" : "In-Progress";
            return { ...wo, status: nextStatus, progress: 10 };
          }
          return wo;
        }));
        triggerNotification("Operation Approved", "Repair state toggled to active workflow.", "System");
      };

      const handleUpdateProgress = (woId, percent, notes) => {
        setWorkOrders(prev => prev.map(wo => {
          if (wo.id === woId) {
            return { ...wo, progress: parseInt(percent), progressNotes: notes };
          }
          return wo;
        }));
      };

      const handleCompleteJob = (woId, finalNotes) => {
        setWorkOrders(prev => prev.map(wo => {
          if (wo.id === woId) {
            if (wo.partsRequired !== "None") {
              setInventory(inv => inv.map(p => {
                if (p.name === wo.partsRequired && p.quantity > 0) {
                  return { ...p, quantity: p.quantity - 1 };
                }
                return p;
              }));
            }
            
            setUsers(uList => uList.map(u => {
              if (u.id === wo.assignedToId) {
                const finished = (u.completedCount || 0) + 1;
                const adRate = Math.min(100, Math.floor(80 + (Math.random() * 20)));
                return { ...u, completedCount: finished, slaAdherence: adRate };
              }
              return u;
            }));

            return { 
              ...wo, 
              status: "Completed", 
              progress: 100, 
              completedAt: new Date().toLocaleString(),
              artisanNotes: finalNotes
            };
          }
          return wo;
        }));
        setArtisanNotesInput("");
        triggerNotification("Outage SLA Resolved ✔️", "Performance logs registered. Ticket cleared.", "System");
      };

      const handleReportShortage = (e) => {
        e.preventDefault();
        if (!partComplaintInput.trim()) return;

        const existing = shortages.find(s => s.item.toLowerCase() === partComplaintInput.trim().toLowerCase());
        if (existing) {
          setShortages(prev => prev.map(s => s.id === existing.id ? { ...s, count: s.count + 1, status: "Active" } : s));
        } else {
          setShortages(prev => [...prev, { id: `S-${Date.now()}`, item: partComplaintInput.trim(), count: 1, status: "Active" }]);
        }

        triggerNotification("Stock shortage registered", `Logged shortage for '${partComplaintInput}' in system.`, "System");
        setPartComplaintInput("");
      };

      const handleResolveShortage = (shortageId, itemName) => {
        setShortages(prev => prev.filter(s => s.id !== shortageId));
        setInventory(prev => prev.map(p => {
          if (p.name.toLowerCase().includes(itemName.toLowerCase()) || itemName.toLowerCase().includes(p.name.toLowerCase())) {
            return { ...p, quantity: p.quantity + 10 };
          }
          return p;
        }));
        triggerNotification("Stock Replenished", `${itemName} stock restored. Warnings removed.`, "System");
      };

      // Handle logo image load error by toggling fallback state
      const handleLogoLoadError = () => {
        if (!logoImageError) {
          setLogoImageError(true);
        }
      };

      return (
        <div class="min-h-screen flex flex-col justify-between">
          
          {/* --- FIRST-TIME DEVICE DETECTION QUESTIONNAIRE (NEW OR RETURNING) --- */}
          {showDeviceSetup && (
            <div class="fixed inset-0 z-50 bg-[#060911] flex items-center justify-center p-6 text-center select-none overflow-y-auto">
              <div class="max-w-xl w-full bg-brand-cardBg border-2 border-brand-orange rounded-2xl p-8 shadow-2xl space-y-6 text-left">
                
                <div class="w-16 h-16 bg-brand-orange/10 border border-brand-orange rounded-full flex items-center justify-center mx-auto text-3xl">
                  📱
                </div>
                
                <div class="text-center">
                  <h1 class="text-3xl font-extrabold tracking-widest text-white brand-font uppercase">
                    MINESYNC GATEWAY
                  </h1>
                  <p class="text-xs text-brand-steelText mt-1 font-mono">SECURE DEVICE REGISTRATION MATRIX</p>
                </div>

                {setupStateStep === "NEW_OR_RETURNING" && (
                  <div class="space-y-4">
                    <h3 class="text-sm font-bold text-white uppercase tracking-wider font-mono text-center">Is your Metallurgical Organization a New User or Returning?</h3>
                    <div class="grid grid-cols-2 gap-4">
                      <button 
                        onClick={() => setSetupStateStep("NEW_COMPANY_FORM")}
                        class="py-3 bg-brand-orange hover:bg-brand-orangeHover text-white rounded-lg text-xs font-bold font-mono transition-all uppercase"
                      >
                        🆕 New Organization
                      </button>
                      
                      <button 
                        onClick={() => setSetupStateStep("RESTORE_BACKUP")}
                        class="py-3 bg-slate-900 border border-brand-steelBorder hover:border-brand-orange text-brand-steelText hover:text-white rounded-lg text-xs font-bold font-mono transition-all uppercase"
                      >
                        🔄 Returning / Restore
                      </button>
                    </div>
                  </div>
                )}

                {/* New company configuration form */}
                {setupStateStep === "NEW_COMPANY_FORM" && (
                  <form onSubmit={handleRegisterNewDeviceCompany} class="space-y-4 font-mono text-xs text-left">
                    <div>
                      <label class="block text-[10px] text-brand-steelText uppercase mb-1">Enter your Metallurgical Company Name</label>
                      <input 
                        type="text" 
                        required
                        placeholder="e.g. Bongani Metals Ltd" 
                        value={typedRecoveryCompany}
                        onChange={(e) => handleAutocompleteCompanyType(e.target.value)}
                        class="w-full bg-brand-darkBg border border-brand-steelBorder rounded p-2.5 text-white"
                      />
                      {companySuggestions.length > 0 && (
                        <div class="bg-slate-900 border border-brand-steelBorder rounded mt-1 max-h-32 overflow-y-auto">
                          {companySuggestions.map((c, idx) => (
                            <div 
                              key={idx} 
                              onClick={() => { setTypedRecoveryCompany(c); setCompanySuggestions([]); }}
                              class="p-2 hover:bg-slate-800 cursor-pointer text-slate-300 animate-pulse"
                            >
                              🏢 {c}
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    <div class="flex gap-4 pt-2">
                      <button type="submit" class="flex-grow py-3 bg-brand-orange text-white font-bold uppercase rounded text-xs">
                        Establish Company & Register Device
                      </button>
                      <button 
                        type="button" 
                        onClick={handleSkipSetup}
                        class="px-4 py-3 bg-slate-900 border border-brand-steelBorder text-slate-300 rounded text-xs uppercase"
                      >
                        Not Yet
                      </button>
                    </div>
                  </form>
                )}

                {/* Cloud restore option */}
                {setupStateStep === "RESTORE_BACKUP" && (
                  <form onSubmit={handleCloudRecovery} class="space-y-4 font-mono text-xs text-left">
                    <div>
                      <label class="block text-[10px] text-brand-steelText uppercase mb-1">Company / Organization Name</label>
                      <input 
                        type="text" 
                        required
                        placeholder="e.g. Bongani Metals Ltd"

                      value={profileAddress}
                      onChange={(e) => setProfileAddress(e.target.value)}
                      class="w-full bg-brand-darkBg border border-brand-steelBorder rounded p-2 text-white"
                    />
                  </div>

                  <div class="border-t border-brand-steelBorder/40 pt-3 space-y-3">
                    <h4 class="text-[10px] font-bold text-brand-orange uppercase">🚨 On-Site Emergency Contacts</h4>
                    <div class="grid grid-cols-2 gap-3">
                      <div class="space-y-1">
                        <label class="block text-[9px] text-brand-steelText uppercase font-bold font-mono">Next of Kin Name</label>
                        <input 
                          type="text"
                          required
                          placeholder="e.g. Sarah Nyoni"
                          value={profileEmergencyName}
                          onChange={(e) => setProfileEmergencyName(e.target.value)}
                          class="w-full bg-brand-darkBg border border-brand-steelBorder rounded p-2 text-white"
                        />
                      </div>
                      <div class="space-y-1">
                        <label class="block text-[9px] text-brand-steelText uppercase font-bold">Emergency Phone</label>
                        <input 
                          type="text"
                          required
                          placeholder="e.g. +263771122334"
                          value={profileEmergencyPhone}
                          onChange={(e) => setProfileEmergencyPhone(e.target.value)}
                          class="w-full bg-brand-darkBg border border-brand-steelBorder rounded p-2 text-white font-mono"
                        />
                      </div>
                    </div>
                  </div>

                  <button type="submit" class="w-full py-2.5 bg-brand-orange hover:bg-brand-orangeHover text-white font-bold uppercase rounded font-mono">
                    Save Profile & Clear Flag
                  </button>
                </form>

              </div>
            </div>
          )}

          {/* --- F. EMPLOYEE PROFILE INSPECTOR MODAL --- */}
          {inspectingEmployee && (
            <div class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 overflow-y-auto no-print">
              <div class="max-w-md w-full bg-brand-cardBg border-2 border-brand-orange rounded-xl p-8 shadow-2xl relative text-left space-y-4 font-mono text-xs">
                
                <button 
                  onClick={() => setInspectingEmployee(null)}
                  class="absolute top-4 right-4 text-slate-500 hover:text-white font-extrabold text-sm"
                >
                  ✕ Close
                </button>

                <div class="text-center pb-2 border-b border-brand-steelBorder">
                  <div class="w-16 h-16 rounded-full border-2 border-brand-orange bg-slate-800 flex items-center justify-center overflow-hidden mx-auto mb-2">
                    {inspectingEmployee.profileImg ? (
                      <img src={inspectingEmployee.profileImg} alt="Avatar" class="w-full h-full object-cover" />
                    ) : (
                      <span class="text-lg font-bold text-slate-500">{inspectingEmployee.name.slice(0, 2).toUpperCase()}</span>
                    )}
                  </div>
                  <h3 class="text-md font-bold uppercase text-white brand-font">{inspectingEmployee.name}</h3>
                  <p class="text-[10px] text-brand-orange uppercase">Roster Trade: {inspectingEmployee.trade} // Role: {inspectingEmployee.role}</p>
                </div>

                <div class="space-y-2 bg-slate-950 p-4 rounded-lg border border-brand-steelBorder leading-relaxed">
                  <h4 class="text-xs font-bold text-white uppercase border-b border-brand-steelBorder pb-1 mb-2 font-mono">🏢 Shift Contact Profile:</h4>
                  <p><strong>Roster Email:</strong> {inspectingEmployee.email}</p>
                  <p><strong>WhatsApp Line:</strong> {inspectingEmployee.whatsapp || "Not configured"}</p>
                  <p><strong>Date of Birth (DOB):</strong> {inspectingEmployee.dob || "Not configured"}</p>
                  <p><strong>Home Address:</strong> {inspectingEmployee.address || "Not configured"}</p>
                </div>

                <div class="space-y-2 bg-red-950/20 p-4 rounded-lg border border-red-900 leading-relaxed">
                  <h4 class="text-xs font-bold text-red-400 uppercase border-b border-red-900 pb-1 mb-2">🚨 EMERGENCY CONTACT INFO:</h4>
                  <p><strong>Next of Kin Name:</strong> <span class="text-white font-bold">{inspectingEmployee.emergencyName || "Not configured"}</span></p>
                  <p><strong>Emergency Contact Phone:</strong> <span class="text-brand-orange font-bold font-mono">{inspectingEmployee.emergencyPhone || "Not configured"}</span></p>
                </div>

                <div class="text-center font-sans">
                  <p class="text-[9px] text-slate-500 leading-normal">Keep this emergency card secure. Dispatched in compliance with Mining Health & Safety Act.</p>
                </div>

              </div>
            </div>
          )}

          {/* --- PRINTABLE CERTIFICATE MODAL --- */}
          {activePrintWO && (
            <div class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 overflow-y-auto no-print">
              <div class="max-w-2xl w-full bg-white text-black p-8 rounded shadow-2xl relative space-y-6">
                
                <button 
                  onClick={() => setActivePrintWO(null)}
                  class="absolute top-4 right-4 text-slate-500 hover:text-black font-extrabold text-sm"
                >
                  ✕ Close
                </button>

                <div id="print-sheet-content" class="print-card space-y-8 font-serif text-black leading-relaxed">
                  
                  {/* Header */}
                  <div class="border-b-2 border-black pb-4 flex justify-between items-start font-sans">
                    <div>
                      <h1 class="text-xl font-bold tracking-tight uppercase">{companyName}</h1>
                      <p class="text-xs tracking-wider font-mono">OUTAGE CLEARANCE COMPLIANCE CERTIFICATE</p>
                      <p class="text-[10px] text-slate-600 font-mono mt-0.5">SYSTEM GENERATED CERTIFICATE ID: {activePrintWO.id}</p>
                    </div>
                    
                    <div class="w-14 h-14 bg-white border border-black flex items-center justify-center p-0.5">
                      {!logoImageError ? (
                        <img 
                          src={companyLogoUrl} 
                          alt="Logo Stamp" 
                          class="max-h-full max-w-full object-contain" 
                          onError={handleLogoLoadError} 
                        />
                      ) : (
                        <div class="font-sans font-bold text-xs">MINESYNC</div>
                      )}
                    </div>
                  </div>

                  {/* Section 1: Specifications */}
                  <div class="space-y-3 font-sans">
                    <h3 class="text-sm font-bold uppercase border-b border-black pb-1">1. OUTAGE WORK ORDER OVERVIEW:</h3>
                    <table class="w-full text-xs text-left border-collapse">
                      <tbody>
                        <tr class="border-b border-slate-200">
                          <td class="py-1.5 font-bold w-1/3">Work Order Serial:</td>
                          <td class="py-1.5">{activePrintWO.id}</td>
                        </tr>
                        <tr class="border-b border-slate-200">
                          <td class="py-1.5 font-bold">Equipment Asset:</td>
                          <td class="py-1.5">{activePrintWO.assetName}</td>
                        </tr>
                        <tr class="border-b border-slate-200">
                          <td class="py-1.5 font-bold">Asset Serial Number:</td>
                          <td class="py-1.5 underline">{activePrintWO.serial}</td>
                        </tr>
                        <tr class="border-b border-slate-200">
                          <td class="py-1.5 font-bold">Priority Status:</td>
                          <td class="py-1.5">{activePrintWO.priority}</td>
                        </tr>
                        <tr class="border-b border-slate-200">
                          <td class="py-1.5 font-bold">Expected Shift Duration:</td>
                          <td class="py-1.5">{activePrintWO.durationExpected} days</td>
                        </tr>
                        <tr class="border-b border-slate-200">
                          <td class="py-1.5 font-bold">Approved Budget Cost:</td>
                          <td class="py-1.5">${activePrintWO.repairCost || "Standard clearance"}</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>

                  {/* Section 2: Written description guidelines */}
                  <div class="space-y-2">
                    <h3 class="text-sm font-bold uppercase border-b border-black pb-1 font-sans">2. SPECIFIC REPAIR INSTRUCTIONS:</h3>
                    <p class="text-xs italic bg-slate-100 p-2 rounded font-sans">
                      &ldquo; {activePrintWO.title} &rdquo;
                    </p>
                    <p class="text-xs leading-relaxed text-slate-700 font-sans">
                      <strong>Method Statement:</strong> {activePrintWO.description}
                    </p>
                    {activePrintWO.engineeringDirective && (
                      <p class="text-xs text-red-800 bg-red-50 p-2 border-l-2 border-red-800 font-sans">
                        <strong>Engineering Directive Override:</strong> {activePrintWO.engineeringDirective}
                      </p>
                    )}
                  </div>

                  {/* Section 3: Artisan logs */}
                  <div class="space-y-2">
                    <h3 class="text-sm font-bold uppercase border-b border-black pb-1 font-sans">3. EXECUTING ROSTER LOGS:</h3>
                    <p class="text-xs font-sans">
                      <strong>Executing Artisan:</strong> {activePrintWO.assignedToName} (Roster Trade: {activePrintWO.assignedToName.includes("Bongani") ? "Boiler Maker" : "Fitter"})
                    </p>
                    <p class="text-xs font-sans">
                      <strong>Completion Timestamp:</strong> {activePrintWO.completedAt || "PENDING WORK CLEARANCE"}
                    </p>
                    <p class="text-xs leading-relaxed text-slate-700 font-sans">
                      <strong>Artisan Verification Statement:</strong> {activePrintWO.artisanNotes || "Await mechanical completion notes."}
                    </p>
                  </div>

                  {/* SIGN-OFF DOTTED LINES FOR LEGITIMACY SIGNATURES */}
                  <div class="pt-8 border-t-2 border-black grid grid-cols-3 gap-6 text-[10px] font-sans">
                    
                    <div class="space-y-6">
                      <p class="border-b border-black text-center italic text-[11px] h-8 flex items-end justify-center text-slate-700">
                        {activePrintWO.authorizedBy || "___________________"}
                      </p>
                      <p class="text-center uppercase font-bold text-[9px] text-slate-800">Section Engineer<br />(Authorization & Date)</p>
                    </div>

                    <div class="space-y-6">
                      <p class="border-b border-black text-center italic text-[11px] h-8 flex items-end justify-center text-slate-700 font-sans">
                        Verified by Foreman Tau
                      </p>
                      <p class="text-center uppercase font-bold text-[9px] text-slate-800">Shift Foreman<br />(Verification & Date)</p>
                    </div>

                    <div class="space-y-6">
                      <p class="border-b border-black text-center italic text-[11px] h-8 flex items-end justify-center text-slate-700">
                        {activePrintWO.completedAt ? activePrintWO.assignedToName : "___________________"}
                      </p>
                      <p class="text-center uppercase font-bold text-[9px] text-slate-800 font-sans">Artisan Technician<br />(Execution & Date)</p>
                    </div>

                  </div>

                  {/* Official print disclaimers */}
                  <div class="text-[9px] text-slate-500 text-center pt-4 border-t border-slate-200 font-sans">
                    This document is a legitimate written metallurgical compliance certificate generated by MINESYNC. <br />
                    Please safeguard physical copies as per Plant Logistics and Operations guidelines. Support: {companySupportEmail} | Contacts: {companyContacts}
                  </div>

                </div>

                {/* Print and PDF Triggers */}
                <div class="flex gap-4 pt-4 border-t border-slate-200 font-mono text-xs no-print">
                  <button 
                    onClick={() => window.print()}
                    class="flex-1 py-3 bg-brand-orange hover:bg-brand-orangeHover text-white font-bold uppercase rounded shadow-md"
                  >
                    🖨️ Trigger System Print
                  </button>
                  <button 
                    onClick={() => {
                      window.print();
                    }}
                    class="flex-1 py-3 bg-black hover:bg-slate-900 text-white font-bold uppercase rounded shadow-md"
                  >
                    💾 Save as Legit PDF Copy
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* --- FOOTER --- */}
          {currentUser && (
            <footer class="no-print border-t border-brand-steelBorder bg-slate-950 px-6 py-3 flex flex-col md:flex-row justify-between items-center text-xs text-brand-steelText font-mono gap-2">
              <span>MINESYNC PLATFORM OPERATIONS // {companyName.toUpperCase()} LOGISTICS</span>
              <div class="flex gap-4">
                <span>Core DB Records: {assets.length + inventory.length + users.length + workOrders.length + chats.length}</span>
                <span class="text-brand-orange">SLA SECURE</span>
              </div>
            </footer>
          )}

        </div>
      );
    }

    // Work Orders table helper component
    function WorkOrdersTable({ wos, onRowSelect, activeSelectedId }) {
      if (wos.length === 0) {
        return (
          <div class="p-8 text-center bg-brand-darkBg border border-dashed border-brand-steelBorder rounded-lg">
            <span class="text-3xl">🧹</span>
            <p class="text-sm text-brand-steelText font-mono mt-2">No breakdowns reported. Plant is healthy.</p>
          </div>
        );
      }

      return (
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse font-sans">
            <thead>
              <tr class="border-b border-brand-steelBorder text-brand-steelText text-[11px] uppercase font-mono">
                <th class="py-2.5">Code</th>
                <th class="py-2.5">Job Title</th>
                <th class="py-2.5">Asset</th>
                <th class="py-2.5">Assigned To</th>
                <th class="py-2.5">Expected Days</th>
                <th class="py-2.5">Status</th>
                <th class="py-2.5">Progress</th>
              </tr>
            </thead>
            <tbody class="text-xs font-mono text-slate-300 divide-y divide-brand-steelBorder">
              {wos.map((wo, index) => (
                <tr 
                  key={index} 
                  onClick={() => onRowSelect && onRowSelect(wo.id)}
                  class={`hover:bg-brand-orange/10 cursor-pointer transition-colors ${
                    wo.status === "Awaiting Spares" ? "bg-red-950/20 text-red-200" : ""
                  } ${activeSelectedId === wo.id ? "bg-brand-orange/20 border-l-4 border-brand-orange" : ""}`}
                >
                  <td class="py-3 text-brand-orange font-bold pl-2">{wo.id}</td>
                  <td class="py-3">
                    <span class="font-bold text-white block">{wo.title}</span>
                    <span class="text-[10px] text-slate-400 block font-mono">{wo.description.slice(0, 50)}...</span>
                  </td>
                  <td class="py-3">{wo.assetName}</td>
                  <td class="py-3 text-brand-steelText">{wo.assignedToName}</td>
                  <td class="py-3 text-center">{wo.durationExpected}d</td>
                  <td class="py-3">
                    <span class={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                      wo.status === "Pending" ? "bg-amber-500/10 text-amber-400 border border-amber-500/20" :
                      wo.status === "In-Progress" ? "bg-blue-500/10 text-blue-400 border border-blue-500/20" :
                      wo.status === "Awaiting Spares" ? "bg-red-500/10 text-red-500 border border-red-500/20" :
                      "bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"
                    }`}>
                      {wo.status}
                    </span>
                  </td>
                  <td class="py-3 pr-2 animate-duration-300">
                    <div class="flex items-center gap-2">
                      <div class="w-16 bg-slate-900 h-2 rounded overflow-hidden">
                        <div class="bg-brand-orange h-full" style={{ width: `${wo.progress}%` }}></div>
                      </div>
                      <span>{wo.progress}%</span>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // Render React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
